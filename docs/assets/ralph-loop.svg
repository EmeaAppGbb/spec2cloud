<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <filter id="handdrawn" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="#F8FAFC" />
  
  <!-- Loop Path -->
  <path d="M 400 60 C 650 60 750 150 750 250 C 750 350 650 440 400 440 C 150 440 50 350 50 250 C 50 150 150 60 400 60 Z" 
        fill="none" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="10,5" filter="url(#handdrawn)" />

  <!-- Center -->
  <g transform="translate(400, 250)" text-anchor="middle">
    <text y="-10" font-size="28" font-weight="bold" fill="#334155" filter="url(#handdrawn)">The Ralph Loop</text>
    <text y="30" font-size="echo</text>40">
  </g>

  <!-- Steps -->
  <!-- 1. Read State (Top Center) -->
  <g transform="translate(400, 60)">
    <rect x="-70" y="-20" width="140" height="40" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#1E40AF" font-weight="bold">1. Read State</text>
  </g>

  <!-- 2. Determine Task (Top Right) -->
  <g transform="translate(600, 90)">
    <rect x="-75" y="-20" width="150" height="40" rx="8" fill="white" stroke="#64748B" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#334155">2. Determine Task</text>
  </g>

  <!-- 3. Check Skills (Right) -->
  <g transform="translate(720, 180)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="white" stroke="#64748B" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#334155">3. Check Skills</text>
  </g>

  <!-- 4. Search Community (Right Low) -->
  <g transform="translate(720, 320)">
    <rect x="-75" y="-20" width="150" height="40" rx="8" fill="white" stroke="#64748B" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#334155">4. Search Community</text>
  </g>

  <!-- 5. Research (Bottom Right) -->
  <g transform="translate(600, 410)">
    <rect x="-50" y="-20" width="100" height="40" rx="8" fill="white" stroke="#64748B" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#334155">5. Research</text>
  </g>

  <!-- 6. Execute (Bottom Center - Green) -->
  <g transform="translate(400, 440)">
    <rect x="-60" y="-25" width="120" height="50" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="3" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="16" fill="#065F46" font-weight="bold">6. Execute</text>
  </g>

  <!-- 7. Verify (Bottom Left) -->
  <g transform="translate(200, 410)">
    <rect x="-50" y="-20" width="100" height="40" rx="8" fill="white" stroke="#64748B" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#334155">7. Verify</text>
  </g>

  <!-- 8. Create Skill? (Left Low) -->
  <g transform="translate(80, 320)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#5B21B6">8. Create Skill?</text>
  </g>

  <!-- 9. Update State (Left - Blue) -->
  <g transform="translate(80, 180)">
    <rect x="-70" y="-20" width="140" height="40" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#1E40AF" font-weight="bold">9. Update State</text>
  </g>

  <!-- 10. Phase Done? (Left High) -->
  <g transform="translate(140, 110)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="white" stroke="#64748B" stroke-width="2" filter="url(#handdrawn)"/>
    <text y="5" text-anchor="middle" font-size="14" fill="#334155">10. Phase Done?</text>
  </g>

  <!-- 11. Human Gate (Top Left - Orange) -->
  <g transform="translate(260, 80)">
    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" filter="url(#handdrawn)"/>
    <text y="-5" text-anchor="middle" font-size="14" fill="#92400E" font-weight="bold">11. Human Gate</text>
    <text y="15" text-anchor="middle" font-size="12" fill="#92400E">or Advance</text>
  </g>
</svg>
