<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes nodeGlow {
        0%, 100% {
          fill: #1f6feb;
          r: 20;
        }
        50% {
          fill: #58a6ff;
          r: 24;
        }
      }

      @keyframes arrowFlow {
        0% {
          stroke-dashoffset: 30;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes centerGlow {
        0%, 100% {
          opacity: 0.3;
          filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.3));
        }
        50% {
          opacity: 0.6;
          filter: drop-shadow(0 0 16px rgba(88, 166, 255, 0.6));
        }
      }

      /* Individual step animations with staggered delays */
      .step-1 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 0s infinite;
      }

      .step-2 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 0.8s infinite;
      }

      .step-3 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 1.6s infinite;
      }

      .step-4 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 2.4s infinite;
      }

      .step-5 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 3.2s infinite;
      }

      .step-6 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 4.0s infinite;
      }

      .step-7 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 4.8s infinite;
      }

      .step-8 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 5.6s infinite;
      }

      .step-9 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 6.4s infinite;
      }

      .step-10 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 7.2s infinite;
      }

      .step-11 {
        animation: nodeGlow 0.8s cubic-bezier(0.4, 0, 0.6, 1) 8.0s infinite;
      }

      .arrow {
        stroke-dasharray: 30, 30;
        animation: arrowFlow 0.6s linear infinite;
      }

      .center-glow {
        animation: centerGlow 3s ease-in-out infinite;
      }

      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #e6edf3;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .center-text {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .label {
        font-size: 11px;
        fill: #e6edf3;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#0d1117"/>

  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#58a6ff" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Connection arrows (animated flowing) -->
  <g class="arrow" stroke="#58a6ff" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round">
    <!-- Arrow from step 1 to 2 -->
    <path d="M 720.5 150 Q 750 130 760 90" marker-end="url(#arrowhead)" style="animation-delay: 0s;"/>
    <!-- Arrow from step 2 to 3 -->
    <path d="M 760 90 Q 770 50 740 30" marker-end="url(#arrowhead)" style="animation-delay: 0.1s;"/>
    <!-- Arrow from step 3 to 4 -->
    <path d="M 740 30 Q 700 10 650 20" marker-end="url(#arrowhead)" style="animation-delay: 0.2s;"/>
    <!-- Arrow from step 4 to 5 -->
    <path d="M 650 20 Q 590 30 560 70" marker-end="url(#arrowhead)" style="animation-delay: 0.3s;"/>
    <!-- Arrow from step 5 to 6 -->
    <path d="M 560 70 Q 530 120 550 170" marker-end="url(#arrowhead)" style="animation-delay: 0.4s;"/>
    <!-- Arrow from step 6 to 7 -->
    <path d="M 550 170 Q 570 220 620 250" marker-end="url(#arrowhead)" style="animation-delay: 0.5s;"/>
    <!-- Arrow from step 7 to 8 -->
    <path d="M 620 250 Q 680 280 730 270" marker-end="url(#arrowhead)" style="animation-delay: 0.6s;"/>
    <!-- Arrow from step 8 to 9 -->
    <path d="M 730 270 Q 770 260 770 220" marker-end="url(#arrowhead)" style="animation-delay: 0.7s;"/>
    <!-- Arrow from step 9 to 10 -->
    <path d="M 770 220 Q 760 160 710 120" marker-end="url(#arrowhead)" style="animation-delay: 0.8s;"/>
    <!-- Arrow from step 10 to 11 -->
    <path d="M 710 120 Q 650 100 610 150" marker-end="url(#arrowhead)" style="animation-delay: 0.9s;"/>
    <!-- Arrow from step 11 to 1 -->
    <path d="M 610 150 Q 620 180 680 200" marker-end="url(#arrowhead)" style="animation-delay: 1s;"/>
  </g>

  <!-- Step nodes arranged in a circle (radius ~280, centered at 400,400) -->

  <!-- Step 1: Read State (top) -->
  <g>
    <circle cx="400" cy="100" r="20" class="step-1" fill="#1f6feb"/>
    <rect x="385" y="85" width="30" height="30" rx="4" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="390" y1="100" x2="410" y2="100" stroke="#58a6ff" stroke-width="2"/>
    <text class="label" x="400" y="145">Read State</text>
  </g>

  <!-- Step 2: Determine Task -->
  <g>
    <circle cx="720.5" cy="150" r="20" class="step-2" fill="#1f6feb"/>
    <circle cx="720" cy="150" r="8" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="720" cy="150" r="12" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
    <text class="label" x="720" y="195">Determine Task</text>
  </g>

  <!-- Step 3: Check Local Skills -->
  <g>
    <circle cx="760" cy="90" r="20" class="step-3" fill="#1f6feb"/>
    <rect x="750" y="80" width="20" height="20" rx="2" fill="none" stroke="#7ee787" stroke-width="2"/>
    <line x1="756" y1="85" x2="764" y2="95" stroke="#7ee787" stroke-width="1.5"/>
    <text class="label" x="760" y="130">Check Local Skills</text>
  </g>

  <!-- Step 4: Search Community -->
  <g>
    <circle cx="740" cy="30" r="20" class="step-4" fill="#1f6feb"/>
    <circle cx="740" cy="30" r="10" fill="none" stroke="#7ee787" stroke-width="2"/>
    <circle cx="740" cy="30" r="14" fill="none" stroke="#7ee787" stroke-width="1" opacity="0.5"/>
    <text class="label" x="740" y="-15">Search Community</text>
  </g>

  <!-- Step 5: Research Practices -->
  <g>
    <circle cx="650" cy="20" r="20" class="step-5" fill="#1f6feb"/>
    <path d="M 645 10 L 655 10 L 655 30 L 645 30 Z" fill="none" stroke="#7ee787" stroke-width="1.5"/>
    <path d="M 647 15 L 653 15 M 647 20 L 653 20 M 647 25 L 653 25" stroke="#7ee787" stroke-width="1"/>
    <text class="label" x="650" y="-25">Research Practices</text>
  </g>

  <!-- Step 6: Execute Task -->
  <g>
    <circle cx="560" cy="70" r="20" class="step-6" fill="#1f6feb"/>
    <path d="M 550 65 L 570 65 L 560 80 Z" fill="#f0883e" opacity="0.7"/>
    <text class="label" x="560" y="110">Execute Task</text>
  </g>

  <!-- Step 7: Verify Outcome -->
  <g>
    <circle cx="550" cy="170" r="20" class="step-7" fill="#1f6feb"/>
    <path d="M 540 170 L 548 178 L 560 160" fill="none" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="550" y="215">Verify Outcome</text>
  </g>

  <!-- Step 8: Create Skill? -->
  <g>
    <circle cx="620" cy="250" r="20" class="step-8" fill="#1f6feb"/>
    <rect x="610" y="240" width="20" height="20" rx="3" fill="none" stroke="#d2a8ff" stroke-width="2"/>
    <path d="M 620 235 L 620 245 M 615 240 L 625 240" stroke="#d2a8ff" stroke-width="1.5" stroke-linecap="round"/>
    <text class="label" x="620" y="295">Create Skill?</text>
  </g>

  <!-- Step 9: Update State -->
  <g>
    <circle cx="730" cy="270" r="20" class="step-9" fill="#1f6feb"/>
    <rect x="720" y="260" width="20" height="20" rx="2" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <path d="M 724 266 L 728 270 L 736 262" fill="none" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round"/>
    <text class="label" x="730" y="315">Update State</text>
  </g>

  <!-- Step 10: Phase Complete? -->
  <g>
    <circle cx="770" cy="220" r="20" class="step-10" fill="#1f6feb"/>
    <rect x="760" y="210" width="20" height="20" rx="3" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <path d="M 768 212 L 768 228 M 772 212 L 772 228" stroke="#79c0ff" stroke-width="1" stroke-linecap="round"/>
    <text class="label" x="770" y="260">Phase Complete?</text>
  </g>

  <!-- Step 11: Human Gate / Advance -->
  <g>
    <circle cx="710" cy="120" r="20" class="step-11" fill="#1f6feb"/>
    <circle cx="710" cy="115" r="6" fill="none" stroke="#ff7b72" stroke-width="2"/>
    <path d="M 710 121 L 710 126 L 704 132 M 710 126 L 716 132" stroke="#ff7b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="710" y="160">Human Gate</text>
  </g>

  <!-- Center circle with glow and text -->
  <g class="center-glow">
    <circle cx="400" cy="400" r="80" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
    <circle cx="400" cy="400" r="65" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.1"/>
  </g>

  <text class="center-text" x="400" y="395" fill="#58a6ff">Ralph Loop</text>
  <text x="400" y="420" font-size="11px" fill="#7ee787" text-anchor="middle">11-Step Orchestration</text>
</svg>