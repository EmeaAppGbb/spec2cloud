<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .shadow { filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1)); }
    </style>
  </defs>
  <rect width="800" height="400" fill="#F8FAFC" rx="0"/>

  <!-- Left: State Persistence -->
  <g class="fade-in">
    <text x="30" y="30" font-size="17" font-weight="bold" fill="#1E40AF">📁 State Persistence</text>
    <rect x="30" y="45" width="360" height="280" rx="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2" class="shadow"/>
    
    <g transform="translate(50, 80)">
      <text x="0" y="0" font-size="14" fill="#1E3A8A">📍 state.json</text>
      <text x="25" y="20" font-size="12" fill="#475569">Where you are (phase, increment, status)</text>

      <text x="0" y="55" font-size="14" fill="#1E3A8A">📜 audit.log</text>
      <text x="25" y="75" font-size="12" fill="#475569">What happened (append-only timeline)</text>

      <text x="0" y="110" font-size="14" fill="#1E3A8A">🤖 models.json</text>
      <text x="25" y="130" font-size="12" fill="#475569">Which AI model per role</text>

      <line x1="0" y1="160" x2="320" y2="160" stroke="#93C5FD" stroke-width="1"/>

      <text x="0" y="190" font-size="13" font-weight="bold" fill="#1E40AF">Committed to git after every action</text>
      <text x="0" y="220" font-size="13" font-weight="bold" fill="#1E40AF">↕ Resume from any interruption</text>
    </g>
  </g>

  <!-- Right: Human Gates -->
  <g class="fade-in" style="animation-delay: 0.2s">
    <text x="410" y="30" font-size="17" font-weight="bold" fill="#D97706">🚦 Human Gates</text>
    <rect x="410" y="45" width="360" height="280" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2" class="shadow"/>

    <g transform="translate(430, 80)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Spec Review — <tspan font-size="12" fill="#78350F">PRD + FRDs approved</tspan></text>
      </g>
      <g transform="translate(0, 35)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Design Review — <tspan font-size="12" fill="#78350F">UI/UX prototypes</tspan></text>
      </g>
      <g transform="translate(0, 70)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Tech Stack — <tspan font-size="12" fill="#78350F">ADRs reviewed</tspan></text>
      </g>
      <g transform="translate(0, 105)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Gherkin — <tspan font-size="12" fill="#78350F">Test scenarios approved</tspan></text>
      </g>
      <g transform="translate(0, 140)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Code Review — <tspan font-size="12" fill="#78350F">PR approved</tspan></text>
      </g>
      <g transform="translate(0, 175)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Deploy — <tspan font-size="12" fill="#78350F">Smoke tests pass</tspan></text>
      </g>
      <g transform="translate(0, 210)">
        <text x="0" y="0" font-size="14" fill="#92400E">✅ Testability — <tspan font-size="12" fill="#78350F">Track A/B decision</tspan></text>
      </g>
    </g>
  </g>

  <!-- Bottom Pill -->
  <g transform="translate(150, 345)" class="fade-in" style="animation-delay: 0.4s">
    <rect width="500" height="40" rx="20" fill="#334155" class="shadow"/>
    <text x="250" y="25" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PAUSE → REVIEW → APPROVE → CONTINUE</text>
  </g>

</svg>