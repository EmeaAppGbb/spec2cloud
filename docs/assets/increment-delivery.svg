<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">

<style>
    text { font-family: -apple-system, system-ui, sans-serif; }
    .title { font-size: 20px; font-weight: bold; fill: #1E293B; }
    .label { font-size: 14px; fill: #334155; }
    .box { stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }
    .connector { stroke: #64748B; stroke-width: 2; fill: none; stroke-linecap: round; }
    .gate-icon { fill: #EF4444; font-size: 16px; }
    .phase-label { font-size: 12px; font-weight: bold; fill: #64748B; text-transform: uppercase; letter-spacing: 1px; }
</style>

<rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>

<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B" />
    </marker>
</defs>

<!-- Steps -->
<g transform="translate(50, 50)">
    <!-- Step 1: Tests -->
    <rect x="0" y="0" width="150" height="80" fill="#EF444410" stroke="#EF4444" class="box"/>
    <text x="75" y="30" text-anchor="middle" class="title" fill="#EF4444">TESTS</text>
    <text x="75" y="55" text-anchor="middle" class="label">Step 1</text>
    
    <text x="75" y="100" text-anchor="middle" class="label" font-size="12">E2E specs</text>
    <text x="75" y="120" text-anchor="middle" class="label" font-size="12">Gherkin</text>
    <text x="75" y="140" text-anchor="middle" class="label" font-size="12">Unit tests</text>
    <text x="75" y="165" text-anchor="middle" class="label" fill="#EF4444" font-weight="bold">🔴 Red baseline</text>

    <!-- Arrow 1 -->
    <path d="M150 40 L190 40" class="connector" marker-end="url(#arrow)"/>
    <text x="170" y="30" text-anchor="middle" font-size="20">🚦</text>

    <!-- Step 2: Contracts -->
    <g transform="translate(190, 0)">
        <rect x="0" y="0" width="150" height="80" fill="#DBEAFE" stroke="#3B82F6" class="box"/>
        <text x="75" y="30" text-anchor="middle" class="title">CONTRACTS</text>
        <text x="75" y="55" text-anchor="middle" class="label">Step 2</text>
        
        <text x="75" y="100" text-anchor="middle" class="label" font-size="12">OpenAPI</text>
        <text x="75" y="120" text-anchor="middle" class="label" font-size="12">TS types</text>
        <text x="75" y="140" text-anchor="middle" class="label" font-size="12">Infra contracts</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M340 40 L380 40" class="connector" marker-end="url(#arrow)"/>

    <!-- Step 3: Implement -->
    <g transform="translate(380, 0)">
        <rect x="0" y="0" width="150" height="80" fill="#FEF3C7" stroke="#F59E0B" class="box"/>
        <text x="75" y="30" text-anchor="middle" class="title">IMPLEMENT</text>
        <text x="75" y="55" text-anchor="middle" class="label">Step 3</text>
        
        <text x="75" y="100" text-anchor="middle" class="label" font-size="12">API slice</text>
        <text x="75" y="120" text-anchor="middle" class="label" font-size="12">Web slice</text>
        <text x="75" y="140" text-anchor="middle" class="label" font-size="12">Integration</text>
        <text x="75" y="165" text-anchor="middle" class="label" fill="#10B981" font-weight="bold">🟢 Green baseline</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M530 40 L570 40" class="connector" marker-end="url(#arrow)"/>
    <text x="550" y="30" text-anchor="middle" font-size="20">🚦</text>

    <!-- Step 4: Deploy -->
    <g transform="translate(570, 0)">
        <rect x="0" y="0" width="150" height="80" fill="#D1FAE5" stroke="#10B981" class="box"/>
        <text x="75" y="30" text-anchor="middle" class="title">DEPLOY</text>
        <text x="75" y="55" text-anchor="middle" class="label">Step 4</text>
        
        <text x="75" y="100" text-anchor="middle" class="label" font-size="12">azd up</text>
        <text x="75" y="120" text-anchor="middle" class="label" font-size="12">Smoke tests</text>
        <text x="75" y="140" text-anchor="middle" class="label" font-size="12">Regression</text>
        <text x="75" y="165" text-anchor="middle" class="label" fill="#10B981" font-weight="bold">✅ Live</text>
    </g>
</g>

</svg>