<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#F8FAFC" rx="0"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">🚦 Human Approval Gates</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#64748B">Nothing ships without your sign-off</text>

  <!-- Columns -->
  <!-- Greenfield -->
  <g class="fade-in delay-100">
    <rect x="50" y="90" width="340" height="350" rx="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));"/>
    <text x="220" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">Greenfield Gates</text>
    
    <g transform="translate(80, 150)">
      <text x="0" y="0" font-size="12" fill="#1E3A8A">🚦 Phase 0: Shell Setup</text>
      <text x="0" y="30" font-size="12" fill="#1E3A8A">🚦 Phase 1a: PRD + FRDs</text>
      <text x="0" y="60" font-size="12" fill="#1E3A8A">🚦 Phase 1b: UI/UX Prototypes</text>
      <text x="0" y="90" font-size="12" fill="#1E3A8A">🚦 Phase 1c: Increment Plan</text>
      <text x="0" y="120" font-size="12" fill="#1E3A8A">🚦 Phase 1d: Tech Stack + ADRs</text>
      <text x="0" y="150" font-size="12" fill="#1E3A8A">🚦 Step 1: Gherkin Scenarios</text>
      <text x="0" y="180" font-size="12" fill="#1E3A8A">🚦 Step 3: PR Code Review</text>
      <text x="0" y="210" font-size="12" fill="#1E3A8A">🚦 Step 4: Deployment Verified</text>
    </g>
  </g>

  <!-- Brownfield -->
  <g class="fade-in delay-200">
    <rect x="410" y="90" width="340" height="350" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));"/>
    <text x="580" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#D97706">Brownfield Gates</text>
    
    <g transform="translate(440, 150)">
      <text x="0" y="0" font-size="12" fill="#92400E">🚦 B1 Exit: Extraction Accuracy</text>
      <text x="0" y="30" font-size="12" fill="#92400E">🚦 B2a: PRD Approved</text>
      <text x="0" y="60" font-size="12" fill="#92400E">🚦 B2b: FRDs Approved</text>
      <text x="0" y="90" font-size="12" fill="#92400E">🚦 B2c: Spec Refinement</text>
      <text x="0" y="120" font-size="12" fill="#92400E">🚦 Testability Gate (Track A/B)</text>
      <text x="0" y="150" font-size="12" fill="#92400E">🚦 Green Baseline (Track A)</text>
      <text x="0" y="180" font-size="12" fill="#92400E">🚦 Track B Review</text>
      <text x="0" y="210" font-size="12" fill="#92400E">🚦 Path Selection</text>
    </g>
  </g>

  <!-- Bottom Flow -->
  <text x="400" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">PAUSE ➔ REVIEW ➔ APPROVE ➔ CONTINUE</text>
</svg>
