<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fadeInPulse {
        0% { opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      @keyframes scanFlow {
        0% { opacity: 0; }
        15% { opacity: 1; }
        20% { opacity: 0.5; }
        30% { opacity: 0; }
      }
      @keyframes diamondPulse {
        0% { r: 25; }
        30% { r: 25; }
        32% { r: 28; }
        34% { r: 25; }
        36% { r: 30; }
        38% { r: 25; }
        55% { r: 25; }
        100% { r: 25; }
      }
      @keyframes diamondGlow {
        0% { opacity: 0; }
        30% { opacity: 0; }
        32% { opacity: 1; }
        40% { opacity: 0.5; }
        55% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes fanOutLeft {
        0% { opacity: 0; d: path('M 500 210 L 500 210'); }
        40% { opacity: 0; }
        42% { opacity: 1; }
        55% { opacity: 1; d: path('M 500 210 L 350 280'); }
        100% { opacity: 1; }
      }
      @keyframes fanOutMidLeft {
        0% { opacity: 0; d: path('M 500 210 L 500 210'); }
        40% { opacity: 0; }
        42% { opacity: 1; }
        55% { opacity: 1; d: path('M 500 210 L 400 310'); }
        100% { opacity: 1; }
      }
      @keyframes fanOutCenter {
        0% { opacity: 0; d: path('M 500 210 L 500 210'); }
        40% { opacity: 0; }
        42% { opacity: 1; }
        55% { opacity: 1; d: path('M 500 210 L 500 330'); }
        100% { opacity: 1; }
      }
      @keyframes fanOutMidRight {
        0% { opacity: 0; d: path('M 500 210 L 500 210'); }
        40% { opacity: 0; }
        42% { opacity: 1; }
        55% { opacity: 1; d: path('M 500 210 L 600 310'); }
        100% { opacity: 1; }
      }
      @keyframes fanOutRight {
        0% { opacity: 0; d: path('M 500 210 L 500 210'); }
        40% { opacity: 0; }
        42% { opacity: 1; }
        55% { opacity: 1; d: path('M 500 210 L 650 280'); }
        100% { opacity: 1; }
      }
      @keyframes convergeLeft {
        0% { opacity: 1; d: path('M 350 280 L 350 280'); }
        55% { opacity: 1; d: path('M 350 280 L 350 280'); }
        70% { opacity: 1; d: path('M 350 280 L 370 370'); }
        100% { opacity: 1; }
      }
      @keyframes convergeMidLeft {
        0% { opacity: 1; d: path('M 400 310 L 400 310'); }
        55% { opacity: 1; d: path('M 400 310 L 400 310'); }
        70% { opacity: 1; d: path('M 400 310 L 400 370'); }
        100% { opacity: 1; }
      }
      @keyframes convergeCenter {
        0% { opacity: 1; d: path('M 500 330 L 500 330'); }
        55% { opacity: 1; d: path('M 500 330 L 500 330'); }
        70% { opacity: 1; d: path('M 500 330 L 500 370'); }
        100% { opacity: 1; }
      }
      @keyframes convergeMidRight {
        0% { opacity: 1; d: path('M 600 310 L 600 310'); }
        55% { opacity: 1; d: path('M 600 310 L 600 310'); }
        70% { opacity: 1; d: path('M 600 310 L 600 370'); }
        100% { opacity: 1; }
      }
      @keyframes convergeRight {
        0% { opacity: 1; d: path('M 650 280 L 650 280'); }
        55% { opacity: 1; d: path('M 650 280 L 650 280'); }
        70% { opacity: 1; d: path('M 650 280 L 630 370'); }
        100% { opacity: 1; }
      }
      @keyframes nodeHighlight {
        0% { fill-opacity: 0.3; }
        100% { fill-opacity: 0.8; }
      }
      .existing-code { animation: fadeInPulse 15s ease-in-out infinite; }
      .extraction { animation: fadeInPulse 15s ease-in-out 2s infinite; }
      .spec-gen { animation: fadeInPulse 15s ease-in-out 4s infinite; }
      .decision { animation: fadeInPulse 15s ease-in-out 6s infinite; }
      .decision-circle { animation: diamondGlow 15s ease-in-out infinite; }
      .decision-pulse { animation: diamondPulse 15s ease-in-out infinite; }
      .path-left { animation: fanOutLeft 15s ease-in-out infinite; }
      .path-midleft { animation: fanOutMidLeft 15s ease-in-out infinite; }
      .path-center { animation: fanOutCenter 15s ease-in-out infinite; }
      .path-midright { animation: fanOutMidRight 15s ease-in-out infinite; }
      .path-right { animation: fanOutRight 15s ease-in-out infinite; }
      .conv-left { animation: convergeLeft 15s ease-in-out infinite; }
      .conv-midleft { animation: convergeMidLeft 15s ease-in-out infinite; }
      .conv-center { animation: convergeCenter 15s ease-in-out infinite; }
      .conv-midright { animation: convergeMidRight 15s ease-in-out infinite; }
      .conv-right { animation: convergeRight 15s ease-in-out infinite; }
      .assess { animation: fadeInPulse 15s ease-in-out 8s infinite; }
      .plan { animation: fadeInPulse 15s ease-in-out 9.5s infinite; }
      .delivery { animation: fadeInPulse 15s ease-in-out 11s infinite; }
      .cloud { animation: fadeInPulse 15s ease-in-out 13s infinite; }
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .label-main { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .label-sub { font-size: 12px; fill: #8b949e; }
      .label-skill { font-size: 10px; fill: #e6edf3; }
    </style>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b949e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#0d1117"/>

  <!-- === PHASE 1: EXISTING CODEBASE === -->
  <g class="existing-code">
    <!-- Code bracket icon -->
    <g transform="translate(80, 80)">
      <path d="M 10 5 L 5 15 L 10 25 M 30 5 L 35 15 L 30 25" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="8" y="10" width="14" height="10" fill="none" stroke="#8b949e" stroke-width="1"/>
      <circle cx="15" cy="15" r="1" fill="#8b949e"/>
      <circle cx="15" cy="19" r="1" fill="#8b949e"/>
    </g>
    <text x="80" y="115" text-anchor="middle" class="label-main">Existing Codebase</text>
    <line x1="120" y1="130" x2="200" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- === PHASE B1: EXTRACTION SKILLS === -->
  <g class="extraction">
    <!-- Extraction grid: 2 columns x 3 rows -->
    <g id="extraction-grid">
      <!-- Scanner -->
      <g transform="translate(220, 160)">
        <rect x="-35" y="-20" width="70" height="40" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <circle cx="-15" cy="-10" r="3" fill="#58a6ff"/>
        <circle cx="0" cy="-10" r="3" fill="#58a6ff"/>
        <circle cx="15" cy="-10" r="3" fill="#58a6ff"/>
        <line x1="-15" y1="-7" x2="-15" y2="10" stroke="#58a6ff" stroke-width="1"/>
        <line x1="0" y1="-7" x2="0" y2="10" stroke="#58a6ff" stroke-width="1"/>
        <line x1="15" y1="-7" x2="15" y2="10" stroke="#58a6ff" stroke-width="1"/>
        <text x="0" y="18" text-anchor="middle" class="label-skill">Codebase Scanner</text>
      </g>

      <!-- Dependency -->
      <g transform="translate(320, 160)">
        <rect x="-35" y="-20" width="70" height="40" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <circle cx="-10" cy="-5" r="4" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <circle cx="10" cy="-5" r="4" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <circle cx="0" cy="10" r="4" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <line x1="-10" y1="-1" x2="0" y2="6" stroke="#58a6ff" stroke-width="1"/>
        <line x1="10" y1="-1" x2="0" y2="6" stroke="#58a6ff" stroke-width="1"/>
        <text x="0" y="18" text-anchor="middle" class="label-skill">Dependencies</text>
      </g>

      <!-- Architecture -->
      <g transform="translate(420, 160)">
        <rect x="-35" y="-20" width="70" height="40" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <rect x="-15" y="-10" width="10" height="15" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <rect x="5" y="-10" width="10" height="15" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <line x1="-10" y1="5" x2="10" y2="5" stroke="#58a6ff" stroke-width="1"/>
        <text x="0" y="18" text-anchor="middle" class="label-skill">Architecture</text>
      </g>

      <!-- API Extractor -->
      <g transform="translate(220, 240)">
        <rect x="-35" y="-20" width="70" height="40" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <path d="M -15 -10 Q -15 0 -5 5 Q 5 10 15 5 Q 15 0 15 -10" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
        <circle cx="-5" cy="0" r="2" fill="#58a6ff"/>
        <circle cx="5" cy="0" r="2" fill="#58a6ff"/>
        <text x="0" y="18" text-anchor="middle" class="label-skill">API Extractor</text>
      </g>

      <!-- Data Model -->
      <g transform="translate(320, 240)">
        <rect x="-35" y="-20" width="70" height="40" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <rect x="-12" y="-8" width="8" height="14" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <rect x="4" y="-8" width="8" height="14" fill="none" stroke="#58a6ff" stroke-width="1"/>
        <line x1="-8" y1="2" x2="8" y2="2" stroke="#58a6ff" stroke-width="1"/>
        <line x1="-8" y1="6" x2="8" y2="6" stroke="#58a6ff" stroke-width="1"/>
        <text x="0" y="18" text-anchor="middle" class="label-skill">Data Model</text>
      </g>

      <!-- Test Discovery -->
      <g transform="translate(420, 240)">
        <rect x="-35" y="-20" width="70" height="40" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <path d="M -10 -5 L -5 5 L 0 -5 L 5 5 L 10 -5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="0" y="18" text-anchor="middle" class="label-skill">Test Discovery</text>
      </g>
    </g>

    <line x1="320" y1="290" x2="320" y2="330" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- === PHASE B2: SPEC GENERATION === -->
  <g class="spec-gen">
    <!-- PRD Generator -->
    <g transform="translate(260, 350)">
      <rect x="-30" y="-18" width="60" height="36" rx="4" fill="none" stroke="#d2a8ff" stroke-width="2"/>
      <line x1="-15" y1="-12" x2="15" y2="-12" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="-8" x2="15" y2="-8" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="-4" x2="10" y2="-4" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="4" x2="12" y2="4" stroke="#d2a8ff" stroke-width="1"/>
      <text x="0" y="24" text-anchor="middle" class="label-skill">PRD Generator</text>
    </g>

    <!-- FRD Generator -->
    <g transform="translate(380, 350)">
      <rect x="-30" y="-18" width="60" height="36" rx="4" fill="none" stroke="#d2a8ff" stroke-width="2"/>
      <line x1="-15" y1="-12" x2="15" y2="-12" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="-8" x2="15" y2="-8" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="-4" x2="10" y2="-4" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#d2a8ff" stroke-width="1"/>
      <line x1="-15" y1="4" x2="12" y2="4" stroke="#d2a8ff" stroke-width="1"/>
      <text x="0" y="24" text-anchor="middle" class="label-skill">FRD Generator</text>
    </g>

    <line x1="320" y1="390" x2="500" y2="210" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- === DECISION POINT === -->
  <g class="decision">
    <!-- Diamond background -->
    <circle cx="500" cy="210" r="25" class="decision-circle" fill="none" stroke="#f0883e" stroke-width="3"/>

    <!-- Diamond pulse indicator -->
    <circle cx="500" cy="210" r="25" class="decision-pulse" fill="none" stroke="#f0883e" stroke-width="2" opacity="0.5"/>

    <!-- Diamond shape with text -->
    <text x="500" y="218" text-anchor="middle" class="label-main" font-size="12">Choose</text>
    <text x="500" y="235" text-anchor="middle" class="label-sub" font-size="10">Path</text>
  </g>

  <!-- === FIVE PATHS (FAN OUT) === -->
  <!-- Path 1: Modernize (Left) -->
  <path class="path-left" d="M 500 210 L 500 210" stroke="#7ee787" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <g transform="translate(350, 280)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#7ee787" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" class="label-main" font-size="11">Modernize</text>
  </g>

  <!-- Path 2: Rewrite (Mid-Left) -->
  <path class="path-midleft" d="M 500 210 L 500 210" stroke="#ff7b72" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <g transform="translate(400, 310)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ff7b72" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" class="label-main" font-size="11">Rewrite</text>
  </g>

  <!-- Path 3: Cloud-Native (Center) -->
  <path class="path-center" d="M 500 210 L 500 210" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <g transform="translate(500, 330)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" class="label-main" font-size="10">Cloud-Native</text>
  </g>

  <!-- Path 4: Extend (Mid-Right) -->
  <path class="path-midright" d="M 500 210 L 500 210" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" class="label-main" font-size="11">Extend</text>
  </g>

  <!-- Path 5: Security/Perf (Right) -->
  <path class="path-right" d="M 500 210 L 500 210" stroke="#d2a8ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <g transform="translate(650, 280)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#d2a8ff" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" class="label-main" font-size="10">Security</text>
    <text x="0" y="8" text-anchor="middle" class="label-main" font-size="10">Perf</text>
  </g>

  <!-- === CONVERGENCE PATHS === -->
  <path class="conv-left" d="M 350 280 L 350 280" stroke="#7ee787" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path class="conv-midleft" d="M 400 310 L 400 310" stroke="#ff7b72" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path class="conv-center" d="M 500 330 L 500 330" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path class="conv-midright" d="M 600 310 L 600 310" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path class="conv-right" d="M 650 280 L 650 280" stroke="#d2a8ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- === PHASE A: ASSESS === -->
  <g class="assess">
    <g transform="translate(430, 370)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#f0883e" stroke-width="2"/>
      <text x="0" y="2" text-anchor="middle" class="label-main" font-size="11">Assess</text>
    </g>
    <line x1="430" y1="390" x2="480" y2="420" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- === PHASE P: PLAN === -->
  <g class="plan">
    <g transform="translate(520, 370)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#7ee787" stroke-width="2"/>
      <text x="0" y="2" text-anchor="middle" class="label-main" font-size="11">Plan</text>
    </g>
    <line x1="520" y1="390" x2="520" y2="420" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- === PHASE 2: INCREMENT DELIVERY === -->
  <g class="delivery">
    <g transform="translate(500, 450)">
      <rect x="-40" y="-20" width="80" height="40" rx="6" fill="none" stroke="#79c0ff" stroke-width="2"/>
      <path d="M -20 -12 L -10 -2 L 0 -12 L 10 -2 L 20 -12" fill="none" stroke="#79c0ff" stroke-width="1.5"/>
      <line x1="-15" y1="2" x2="15" y2="2" stroke="#79c0ff" stroke-width="1"/>
      <line x1="-15" y1="6" x2="15" y2="6" stroke="#79c0ff" stroke-width="1"/>
      <line x1="-15" y1="10" x2="10" y2="10" stroke="#79c0ff" stroke-width="1"/>
      <text x="0" y="28" text-anchor="middle" class="label-skill">Increment Delivery</text>
    </g>
    <line x1="500" y1="490" x2="800" y2="80" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- === END: AZURE CLOUD === -->
  <g class="cloud">
    <g transform="translate(800, 80)">
      <!-- Cloud shape -->
      <path d="M -25 -5 Q -30 -15 -20 -20 Q -10 -22 -5 -15 Q 0 -20 10 -18 Q 20 -15 20 -5 Q 25 0 20 8 L -20 8 Q -25 5 -25 -5 Z" fill="none" stroke="#79c0ff" stroke-width="2"/>
      <!-- Azure symbol -->
      <text x="0" y="0" text-anchor="middle" font-size="16">☁</text>
      <text x="0" y="22" text-anchor="middle" class="label-main">Azure Cloud</text>
    </g>
  </g>

  <!-- Legend -->
  <text x="50" y="490" class="label-sub" font-size="11">Brownfield Pipeline • Analyze → Spec-Enable → Choose Path → Assess → Plan → Deliver</text>
</svg>
