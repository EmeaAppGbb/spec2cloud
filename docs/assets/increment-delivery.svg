<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawPath { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .draw-path { stroke-dasharray: 300; stroke-dashoffset: 300; animation: drawPath 0.6s ease-out forwards; }
    </style>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="0"/>

  <!-- Card 1: Tests -->
  <g class="fade-in delay-100" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="20" y="50" width="170" height="220" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <rect x="20" y="50" width="170" height="6" rx="0" fill="#EF4444" />
    <text x="105" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">Step 1: TESTS</text>
    <text x="35" y="110" font-size="12" fill="#7F1D1D">• E2E Playwright</text>
    <text x="35" y="130" font-size="12" fill="#7F1D1D">• Gherkin Scenes</text>
    <text x="35" y="150" font-size="12" fill="#7F1D1D">• Step Defs</text>
    <text x="35" y="170" font-size="12" fill="#7F1D1D">• Vitest Stubs</text>
    <text x="105" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#EF4444">🔴 Red Baseline</text>
    <text x="105" y="240" text-anchor="middle" font-size="14">🚦</text>
  </g>

  <line x1="190" y1="160" x2="210" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-100"/>

  <!-- Card 2: Contracts -->
  <g class="fade-in delay-200" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="215" y="50" width="170" height="220" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <rect x="215" y="50" width="170" height="6" rx="0" fill="#3B82F6" />
    <text x="300" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Step 2: CONTRACTS</text>
    <text x="230" y="110" font-size="12" fill="#1E3A8A">• OpenAPI Specs</text>
    <text x="230" y="130" font-size="12" fill="#1E3A8A">• TS Shared Types</text>
    <text x="230" y="150" font-size="12" fill="#1E3A8A">• Infra (Bicep)</text>
    <text x="300" y="210" text-anchor="middle" font-size="11" font-style="italic" fill="#3B82F6">Enables parallel impl</text>
  </g>

  <line x1="385" y1="160" x2="405" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-200"/>

  <!-- Card 3: Implement -->
  <g class="fade-in delay-300" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="410" y="50" width="170" height="220" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <rect x="410" y="50" width="170" height="6" rx="0" fill="#10B981" />
    <text x="495" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Step 3: IMPLEMENT</text>
    <text x="425" y="110" font-size="12" fill="#064E3B">• API Slice (Express)</text>
    <text x="425" y="130" font-size="12" fill="#064E3B">• Web Slice (Next)</text>
    <text x="425" y="150" font-size="12" fill="#064E3B">• ∥ Parallel → Wire</text>
    <text x="495" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">🟢 All tests pass</text>
    <text x="495" y="240" text-anchor="middle" font-size="14">🚦</text>
  </g>

  <line x1="580" y1="160" x2="600" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-300"/>

  <!-- Card 4: Deploy -->
  <g class="fade-in delay-400" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="605" y="50" width="170" height="220" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
    <rect x="605" y="50" width="170" height="6" rx="0" fill="#F59E0B" />
    <text x="690" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Step 4: DEPLOY</text>
    <text x="620" y="110" font-size="12" fill="#78350F">• azd provision</text>
    <text x="620" y="130" font-size="12" fill="#78350F">• azd deploy</text>
    <text x="620" y="150" font-size="12" fill="#78350F">• Smoke Tests</text>
    <text x="620" y="170" font-size="12" fill="#78350F">• Full Regression</text>
    <text x="690" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">✅ Live on Azure</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 690 270 Q 690 310 400 310 Q 105 310 105 280" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowGray)" stroke-dasharray="4" class="draw-path delay-400"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#64748B" background="#F8FAFC">→ Next increment</text>
</svg>
