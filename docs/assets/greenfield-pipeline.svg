<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">

<style>
    text { font-family: -apple-system, system-ui, sans-serif; }
    .title { font-size: 20px; font-weight: bold; fill: #1E293B; }
    .label { font-size: 14px; fill: #334155; }
    .box { stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }
    .connector { stroke: #64748B; stroke-width: 2; fill: none; stroke-linecap: round; }
    .gate-icon { fill: #EF4444; font-size: 16px; }
    .phase-label { font-size: 12px; font-weight: bold; fill: #64748B; text-transform: uppercase; letter-spacing: 1px; }
</style>

<rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>

<!-- Idea -->
<circle cx="400" cy="40" r="20" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
<text x="400" y="45" text-anchor="middle" font-size="20">💡</text>
<text x="400" y="75" text-anchor="middle" class="title">Product Idea</text>

<path d="M400 80 L400 100" class="connector"/>

<!-- Phase 0 -->
<rect x="250" y="100" width="300" height="50" fill="#F1F5F9" stroke="#94A3B8" class="box"/>
<text x="400" y="130" text-anchor="middle" class="title" style="font-size:16px">Phase 0: Shell Setup</text>

<path d="M400 150 L400 170" class="connector"/>

<!-- Phase 1 -->
<rect x="200" y="170" width="400" height="180" fill="#DBEAFE" stroke="#3B82F6" class="box"/>
<text x="220" y="195" class="phase-label" fill="#3B82F6">Phase 1: Discovery</text>

<g transform="translate(240, 210)">
    <text x="0" y="20" class="label">1a: Spec Refinement</text>
    <text x="200" y="20" class="label">→ 🚦 Human Gate</text>
    
    <text x="0" y="50" class="label">1b: UI/UX Design</text>
    <text x="200" y="50" class="label">→ 🚦 Human Gate</text>
    
    <text x="0" y="80" class="label">1c: Increment Plan</text>
    <text x="200" y="80" class="label">→ 🚦 Human Gate</text>
    
    <text x="0" y="110" class="label">1d: Tech Stack</text>
    <text x="200" y="110" class="label">→ 🚦 Human Gate</text>
</g>

<path d="M400 350 L400 370" class="connector"/>

<!-- Phase 2 -->
<rect x="200" y="370" width="400" height="100" fill="#D1FAE5" stroke="#10B981" class="box"/>
<text x="220" y="395" class="phase-label" fill="#10B981">Phase 2: Delivery (per increment)</text>
<text x="400" y="425" text-anchor="middle" class="title" style="font-size:16px">Tests → Contracts → Implement → Deploy</text>
<text x="400" y="450" text-anchor="middle" class="label">🔄 Repeat for each increment</text>

<path d="M400 470 L400 490" class="connector"/>

<!-- Production -->
<text x="400" y="520" text-anchor="middle" class="title" fill="#0EA5E9">☁️ Production on Azure</text>

</svg>