<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawPath { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .delay-500 { animation-delay: 0.5s; }
      .delay-600 { animation-delay: 0.6s; }
      .draw-path { stroke-dasharray: 300; stroke-dashoffset: 300; animation: drawPath 0.6s ease-out forwards; }
    </style>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#F8FAFC" rx="0"/>

  <!-- Start -->
  <g class="fade-in">
    <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">💡 Start with a Product Idea</text>
  </g>
  <line x1="400" y1="50" x2="400" y2="70" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-100"/>

  <!-- Phase 0 -->
  <g class="fade-in delay-100" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="140" y="75" width="520" height="70" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Phase 0: Shell Setup</text>
    <text x="400" y="120" text-anchor="middle" font-size="12" fill="#475569">Template: Next.js/.NET/Python · Structure · Tests · Azure Infra</text>
  </g>
  <text x="680" y="115" font-size="16" class="fade-in delay-200">🚦</text>

  <line x1="400" y1="145" x2="400" y2="165" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-200"/>

  <!-- Phase 1 -->
  <g class="fade-in delay-200" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="140" y="170" width="520" height="180" rx="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2"/>
    <text x="400" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#1E40AF">Phase 1: Product Discovery</text>
    
    <!-- 1a -->
    <g transform="translate(160, 210)">
        <rect width="230" height="50" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
        <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">1a: Spec Refinement</text>
        <text x="115" y="38" text-anchor="middle" font-size="11" fill="#64748B">PRD → FRDs 🚦</text>
    </g>
    <!-- 1b -->
    <g transform="translate(410, 210)">
        <rect width="230" height="50" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
        <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">1b: UI/UX Design</text>
        <text x="115" y="38" text-anchor="middle" font-size="11" fill="#64748B">Prototypes 🚦</text>
    </g>
    <!-- 1c -->
    <g transform="translate(160, 275)">
        <rect width="230" height="50" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
        <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">1c: Increment Planning</text>
        <text x="115" y="38" text-anchor="middle" font-size="11" fill="#64748B">Walking Skeleton 🚦</text>
    </g>
    <!-- 1d -->
    <g transform="translate(410, 275)">
        <rect width="230" height="50" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
        <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">1d: Tech Stack</text>
        <text x="115" y="38" text-anchor="middle" font-size="11" fill="#64748B">Research &amp; ADRs 🚦</text>
    </g>
  </g>

  <line x1="400" y1="350" x2="400" y2="370" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-300"/>

  <!-- Phase 2 -->
  <g class="fade-in delay-300" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="140" y="375" width="520" height="130" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="400" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#059669">Phase 2: Increment Delivery</text>
    
    <text x="400" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">Tests → Contracts → Implement → Deploy</text>
    <text x="280" y="455" text-anchor="middle" font-size="20">🔴</text>
    <text x="360" y="455" text-anchor="middle" font-size="20">📋</text>
    <text x="440" y="455" text-anchor="middle" font-size="20">🟢</text>
    <text x="520" y="455" text-anchor="middle" font-size="20">☁️✅</text>

    <text x="400" y="485" text-anchor="middle" font-size="12" fill="#047857">🔄 Repeat for each increment</text>
    <text x="400" y="500" text-anchor="middle" font-size="11" fill="#064E3B" font-style="italic">Human gates: Gherkin review 🚦, PR review 🚦</text>
  </g>

  <line x1="400" y1="505" x2="400" y2="535" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-400"/>

  <!-- End -->
  <g class="fade-in delay-500">
    <text x="400" y="560" text-anchor="middle" font-size="20" font-weight="700" fill="#059669">☁️ Production on Azure</text>
  </g>
</svg>
