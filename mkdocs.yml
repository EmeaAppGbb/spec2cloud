site_name: spec2cloud
site_description: Transform specifications into production-ready cloud applications
site_url: https://emeaappgbb.github.io/spec2cloud/
repo_url: https://github.com/EmeaAppGbb/spec2cloud
repo_name: EmeaAppGbb/spec2cloud
edit_uri: edit/vNext/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Quick Start: quickstart.md
  - Core Concepts: concepts.md
  - Workflow Guides:
      - Greenfield: greenfield.md
      - Brownfield: brownfield.md
  - Deep Dives:
      - Skills Catalog: skills.md
      - State & Human Gates: state-and-gates.md
      - Architecture: architecture.md
      - Shell Templates: shells.md
  - Examples:
      - Greenfield Walkthrough: examples/greenfield-walkthrough.md
      - "Brownfield: Testable App": examples/brownfield-testable.md
      - "Brownfield: Non-Testable App": examples/brownfield-doc-only.md
