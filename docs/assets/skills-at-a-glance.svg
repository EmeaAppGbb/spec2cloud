<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .shadow { filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1)); }
      .card-title { font-size: 14px; font-weight: bold; }
      .card-body { font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="800" height="450" fill="#F8FAFC" rx="0"/>
  
  <text x="400" y="30" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">43 Skills</text>

  <!-- Row 1 Left: Phase Skills (Green) -->
  <g class="fade-in" transform="translate(30, 50)">
    <rect width="360" height="110" rx="8" fill="white" class="shadow"/>
    <path d="M 0 8 Q 0 0 8 0 L 4 0 L 4 110 L 8 110 Q 0 110 0 102 Z" fill="#22C55E"/> <!-- Left Border -->
    <rect x="0" y="0" width="4" height="110" fill="#22C55E" rx="0"/> <!-- Left strip fix -->
    <text x="15" y="25" class="card-title" fill="#15803D">🟢 Phase Skills (3)</text>
    <text x="15" y="50" class="card-body">
      <tspan x="15" dy="0">spec-refinement, ui-ux-design,</tspan>
      <tspan x="15" dy="16">tech-stack-resolution</tspan>
    </text>
  </g>

  <!-- Row 1 Right: Protocol Skills (Blue) -->
  <g class="fade-in" transform="translate(410, 50)">
    <rect width="360" height="110" rx="8" fill="white" class="shadow"/>
    <rect x="0" y="0" width="4" height="110" fill="#3B82F6" rx="0"/>
    <text x="15" y="25" class="card-title" fill="#1D4ED8">🔵 Protocol Skills (6)</text>
    <text x="15" y="50" class="card-body">
      <tspan x="15" dy="0">state-management, commit-protocol, audit-log,</tspan>
      <tspan x="15" dy="16">human-gate, resume, error-handling</tspan>
    </text>
  </g>

  <!-- Row 2 Left: Delivery Skills (Amber) -->
  <g class="fade-in" transform="translate(30, 180)">
    <rect width="360" height="110" rx="8" fill="white" class="shadow"/>
    <rect x="0" y="0" width="4" height="110" fill="#F59E0B" rx="0"/>
    <text x="15" y="25" class="card-title" fill="#B45309">🟡 Delivery Skills (6)</text>
    <text x="15" y="50" class="card-body">
      <tspan x="15" dy="0">e2e-generation, gherkin-generation,</tspan>
      <tspan x="15" dy="16">test-generation, contract-generation,</tspan>
      <tspan x="15" dy="16">implementation, azure-deployment</tspan>
    </text>
  </g>

  <!-- Row 2 Right: Utility Skills (Purple) -->
  <g class="fade-in" transform="translate(410, 180)">
    <rect width="360" height="110" rx="8" fill="white" class="shadow"/>
    <rect x="0" y="0" width="4" height="110" fill="#A855F7" rx="0"/>
    <text x="15" y="25" class="card-title" fill="#7E22CE">🟣 Utility Skills (8)</text>
    <text x="15" y="50" class="card-body">
      <tspan x="15" dy="0">spec-validator, test-runner, build-check,</tspan>
      <tspan x="15" dy="16">deploy-diagnostics, research, skill-creator,</tspan>
      <tspan x="15" dy="16">skill-discovery, find-skills</tspan>
    </text>
  </g>

  <!-- Row 3 Left: Extraction + Spec (Brown) -->
  <g class="fade-in" transform="translate(30, 310)">
    <rect width="360" height="110" rx="8" fill="white" class="shadow"/>
    <rect x="0" y="0" width="4" height="110" fill="#78350F" rx="0"/>
    <text x="15" y="25" class="card-title" fill="#451A03">🟤 Extraction (6) + Spec Gen (2)</text>
    <text x="15" y="50" class="card-body">
      <tspan x="15" dy="0">codebase-scanner, dependency-inventory,</tspan>
      <tspan x="15" dy="16">architecture-mapper, api-extractor, data-model-extractor,</tspan>
      <tspan x="15" dy="16">test-discovery, prd-generator, frd-generator</tspan>
    </text>
  </g>

  <!-- Row 3 Right: Assessment + Planning (Red) -->
  <g class="fade-in" transform="translate(410, 310)">
    <rect width="360" height="110" rx="8" fill="white" class="shadow"/>
    <rect x="0" y="0" width="4" height="110" fill="#EF4444" rx="0"/>
    <text x="15" y="25" class="card-title" fill="#B91C1C">🔴 Assessment (5) + Planning (5)</text>
    <text x="15" y="50" class="card-body">
      <tspan x="15" dy="0">modernize, rewrite, cloud-native,</tspan>
      <tspan x="15" dy="16">security, performance (+ planners)</tspan>
    </text>
  </g>

</svg>