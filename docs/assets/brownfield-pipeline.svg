<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawPath {
        from { stroke-dashoffset: 300; }
        to { stroke-dashoffset: 0; }
      }
      .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .delay-500 { animation-delay: 0.5s; }
      .delay-600 { animation-delay: 0.6s; }
      .delay-700 { animation-delay: 0.7s; }
      .delay-800 { animation-delay: 0.8s; }
      .delay-900 { animation-delay: 0.9s; }
      .delay-1000 { animation-delay: 1.0s; }
      .draw-path {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: drawPath 0.6s ease-out forwards;
      }
    </style>

  </defs>

  <!-- Background -->
  <rect width="800" height="700" fill="#F8FAFC" rx="0"/>

  <!-- 1. Top Title -->
  <g class="fade-in">
    <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">🏗️ Existing Codebase</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="400" y1="50" x2="400" y2="68" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-100"/>

  <!-- 2. Box 1 – B1: Extract (Blue) -->
  <g class="fade-in delay-100" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="140" y="70" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2"/>
    <text x="400" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#1E40AF">B1: Extract</text>
    <text x="400" y="118" text-anchor="middle" font-size="12" fill="#1E40AF">Scanner · Deps · Architecture · API · Data Models · Tests</text>
    <text x="400" y="140" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">Pure facts, zero judgment</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="400" y1="160" x2="400" y2="185" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-200"/>

  <!-- 3. Box 2 – B2: Spec-Enable (Blue) -->
  <g class="fade-in delay-200" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="180" y="188" width="440" height="85" rx="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2"/>
    <text x="400" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1E40AF">B2: Spec-Enable</text>
    <text x="400" y="237" text-anchor="middle" font-size="12" fill="#1E40AF">PRD Generation · FRD Generation · Spec Refinement</text>
    <text x="400" y="257" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">Always produces valuable docs</text>
  </g>

  <!-- Arrow 3 with gate icon -->
  <line x1="400" y1="273" x2="400" y2="305" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-300"/>
  <text x="418" y="296" font-size="16">🚦</text>

  <!-- 4. Box 3 – Testability Gate (Orange) -->
  <g class="fade-in delay-400" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="160" y="308" width="480" height="100" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" stroke-dasharray="8 4"/>
    <text x="400" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#D97706">⚖️ TESTABILITY GATE</text>
    <text x="400" y="355" text-anchor="middle" font-size="12" fill="#92400E">Can this app be tested?</text>
    <!-- Sub-boxes -->
    <rect x="215" y="366" width="100" height="30" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="265" y="386" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">A: Green</text>
    <rect x="350" y="366" width="100" height="30" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
    <text x="400" y="386" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Hybrid</text>
    <rect x="485" y="366" width="100" height="30" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="535" y="386" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">B: Docs</text>
  </g>

  <!-- Arrow 4 with gate icon -->
  <line x1="400" y1="408" x2="400" y2="440" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-500"/>
  <text x="418" y="432" font-size="16">🚦</text>

  <!-- 5. Box 4 – Path Selection (Purple/Indigo) -->
  <g class="fade-in delay-600" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="150" y="443" width="500" height="80" rx="12" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
    <text x="400" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#4338CA">🧭 Path Selection</text>
    <text x="400" y="494" text-anchor="middle" font-size="12" fill="#4338CA">Modernize · Rewrite · Cloud-Native · Extend · Fix Bugs · Security</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="400" y1="523" x2="400" y2="553" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-700"/>

  <!-- 6. Box 5 – Assess → Plan → Deliver (Green) -->
  <g class="fade-in delay-800" style="filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));">
    <rect x="170" y="556" width="460" height="80" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="400" y="584" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">Assess → Plan → Deliver</text>
    <text x="400" y="606" text-anchor="middle" font-size="12" fill="#059669">Track-aware Phase 2 pipeline · Incremental delivery</text>
  </g>

  <!-- Arrow 6 -->
  <line x1="400" y1="636" x2="400" y2="658" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowGray)" class="draw-path delay-900"/>

  <!-- 7. Bottom Title -->
  <g class="fade-in delay-1000">
    <text x="400" y="682" text-anchor="middle" font-size="20" font-weight="700" fill="#059669">☁️ Production on Azure</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
