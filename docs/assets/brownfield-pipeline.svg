<svg width="800" height="580" viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg">

<style>
    text { font-family: -apple-system, system-ui, sans-serif; }
    .title { font-size: 20px; font-weight: bold; fill: #1E293B; }
    .label { font-size: 14px; fill: #334155; }
    .box { stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }
    .connector { stroke: #64748B; stroke-width: 2; fill: none; stroke-linecap: round; }
    .gate-icon { fill: #EF4444; font-size: 16px; }
    .phase-label { font-size: 12px; font-weight: bold; fill: #64748B; text-transform: uppercase; letter-spacing: 1px; }
</style>

<rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>

<!-- Existing Codebase -->
<text x="400" y="30" text-anchor="middle" class="title">🏗️ Existing Codebase</text>
<path d="M400 40 L400 60" class="connector"/>

<!-- B0 -->
<rect x="250" y="60" width="300" height="40" fill="#F1F5F9" stroke="#94A3B8" class="box"/>
<text x="400" y="85" text-anchor="middle" class="label" font-weight="bold">B0: Onboarding</text>
<path d="M400 100 L400 120" class="connector"/>

<!-- B1 -->
<rect x="200" y="120" width="400" height="80" fill="#DBEAFE" stroke="#3B82F6" class="box"/>
<text x="210" y="140" class="phase-label" fill="#3B82F6">B1: Extract (6 skills)</text>
<text x="400" y="160" text-anchor="middle" class="label">Scanner → Deps → Arch → API → Data → Tests</text>
<text x="400" y="185" text-anchor="middle" class="label" font-style="italic" font-size="12">Pure facts, zero judgment</text>
<path d="M400 200 L400 220" class="connector"/>
<text x="410" y="215" font-size="16">🚦</text>

<!-- B2 -->
<rect x="200" y="220" width="400" height="60" fill="#FEF3C7" stroke="#F59E0B" class="box"/>
<text x="210" y="240" class="phase-label" fill="#F59E0B">B2: Spec-Enable</text>
<text x="400" y="260" text-anchor="middle" class="label">PRD → FRDs → Spec Refinement</text>
<path d="M400 280 L400 300" class="connector"/>
<text x="410" y="295" font-size="16">🚦</text>

<!-- Testability Gate -->
<rect x="150" y="300" width="500" height="100" fill="#FFF7ED" stroke="#F97316" class="box"/>
<text x="400" y="325" text-anchor="middle" class="title" fill="#F97316">Testability Gate</text>
<text x="400" y="345" text-anchor="middle" class="label">Can this app be tested?</text>

<!-- Tracks -->
<g transform="translate(170, 360)">
    <rect x="0" y="0" width="140" height="30" fill="#D1FAE5" stroke="#10B981" rx="4"/>
    <text x="70" y="20" text-anchor="middle" class="label" font-size="12" font-weight="bold">Track A (Testable)</text>
    
    <rect x="160" y="0" width="140" height="30" fill="url(#hybridGrad)" stroke="#64748B" rx="4"/>
    <text x="230" y="20" text-anchor="middle" class="label" font-size="12" font-weight="bold">Hybrid (Mix)</text>
    
    <rect x="320" y="0" width="140" height="30" fill="#FEF3C7" stroke="#F59E0B" rx="4"/>
    <text x="390" y="20" text-anchor="middle" class="label" font-size="12" font-weight="bold">Track B (Doc-Only)</text>
</g>
<defs>
    <linearGradient id="hybridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#D1FAE5;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
</defs>

<path d="M400 400 L400 420" class="connector"/>
<text x="410" y="415" font-size="16">🚦</text>

<!-- Path Selection -->
<rect x="200" y="420" width="400" height="40" fill="#F1F5F9" stroke="#94A3B8" class="box"/>
<text x="400" y="445" text-anchor="middle" class="label" font-weight="bold">Path Selection: Modernize | Rewrite | Cloud | Extend</text>
<path d="M400 460 L400 480" class="connector"/>

<!-- Delivery -->
<rect x="200" y="480" width="400" height="40" fill="#D1FAE5" stroke="#10B981" class="box"/>
<text x="400" y="505" text-anchor="middle" class="label" font-weight="bold">Assess → Plan → Phase 2 Delivery</text>
<path d="M400 520 L400 540" class="connector"/>

<!-- Production -->
<text x="400" y="560" text-anchor="middle" class="title" fill="#0EA5E9">☁️ Production on Azure</text>

</svg>