<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <filter id="handdrawn" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="#F8FAFC" />

  <!-- Left Half: State -->
  <g transform="translate(0, 0)">
    <rect x="20" y="20" width="370" height="460" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#handdrawn)"/>
    <text x="205" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E40AF">State Persistence</text>
    
    <g transform="translate(50, 100)">
      <text x="0" y="0" font-size="16" fill="#1E3A8A" font-family="monospace" font-weight="bold">.spec2cloud/</text>
      <text x="20" y="30" font-size="16" fill="#1E3A8A"  state.json</text>font-family="monospace">
            <text x="160" y="30" font-size="14" fill="#475569">
      <text x="20" y="60" font-size="16" fill="#1E3A8A"  audit.log</text>font-family="monospace">
            <text x="160" y="60" font-size="14" fill="#475569">
      <text x="20" y="90" font-size="16" fill="#1E3A8A"  models.json</text>font-family="monospace">
    </g>      <text x="160" y="90" font-size="14" fill="#475569">

    <text x="205" y="250" text-anchor="middle" font-size="16" fill="#1E40AF">Committed to git after every action</text>
    <text x="205" y="280" text-anchor="middle" font-size="16" fill="# Resume from any point</text>1E40AF">
  </g>

  <!-- Right Half: Human Gates -->
  <g transform="translate(400, 0)">
    <rect x="10" y="20" width="370" height="460" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#handdrawn)"/>
    <text x="195" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#92400E">Human Gates</text>
    <text x="195" y="90" text-anchor="middle" font-size="14" fill="#78350F">
    <g transform="translate(60, 130)">
      <rect x="0" y="0" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=20 font-size=14 fill=#92400E>Gate 1: Specs </text>
      
      <rect x="0" y="40" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=60 font-size=14 fill=#92400E>Gate 2: Design </text>
      
      <rect x="0" y="80" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=100 font-size=14 fill=#92400E>Gate 3: Tech Stack </text>

      <rect x="0" y="120" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=140 font-size=14 fill=#92400E>Gate 4: Gherkin </text>

      <rect x="0" y="160" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=180 font-size=14 fill=#92400E>Gate 5: Code Review </text>

      <rect x="0" y="200" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=220 font-size=14 fill=#92400E>Gate 6: Deployment</text> 

      <rect x="0" y="240" width="270" height="30" rx="4" fill="white" stroke="#FCD34D" stroke-width="1" filter="url(#handdrawn)"/>
      <text x=10 y=260 font-size=14 fill=#92400E>Gate 7: Testability (Brownfield</text>) 
    </g>

 CONTINUE</text>
  </g>
</svg>
